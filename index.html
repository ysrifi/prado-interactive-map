<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Plan interactif du Museo del Prado | TravelOptim</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
<main class="museum-app">

  <!-- EN-TÊTE ET SÉLECTEUR DE LANGUE -->
  <header class="museum-header">
    <div class="museum-header-top">
      <img
        class="museum-logo"
        src="images/logo-traveloptim.png"
        alt="TravelOptim"
      >

      <div class="language-switcher" role="group" aria-label="Choisir la langue" data-i18n-aria="languageLabel">
        <button type="button" class="language-button active" data-lang="fr" aria-pressed="true">FR</button>
        <span class="language-separator" aria-hidden="true">|</span>
        <button type="button" class="language-button" data-lang="en" aria-pressed="false">EN</button>
      </div>
    </div>

    <h1 class="museum-title" data-i18n="museumTitle">
      Plan interactif du Museo del Prado
    </h1>

    <p class="museum-introduction" data-i18n="introduction">
      Sélectionnez un étage, puis cliquez sur une palette pour découvrir
      l’emplacement et les informations essentielles de chaque chef-d’œuvre.
    </p>
  </header>

  <!-- ONGLETS DES ÉTAGES -->
  <nav class="floor-tabs" aria-label="Sélectionner un étage du musée" data-i18n-aria="floorsLabel">
    <button class="floor-tab" type="button" data-floor="2" data-i18n-floor aria-pressed="false">Étage 2</button>
    <button class="floor-tab" type="button" data-floor="1" data-i18n-floor aria-pressed="false">Étage 1</button>
    <button class="floor-tab active" type="button" data-floor="0" data-i18n-floor aria-pressed="true">Étage 0</button>
  </nav>

  <!-- PARCOURS TRAVELOPTIM -->
  <div class="route-toolbar">
    <button
      id="toggle-route-button"
      class="toggle-route-button"
      type="button"
      aria-pressed="false"
      aria-controls="traveloptim-route"
    >
      Afficher le parcours TravelOptim
    </button>
  </div>

  <!-- ESPACE INTERACTIF -->
  <section class="museum-workspace" id="museum-workspace">

    <div class="map-column">
      <div
        class="map-viewport"
        id="map-viewport"
        aria-label="Plan interactif du musée, déplaçable et zoomable" data-i18n-aria="viewportLabel"
      >
        <div class="map-stage" id="map-stage">

          <!-- IMAGE FR / EN -->
          <img
            class="museum-map"
            id="museum-map-image"
            src="images/plan-prado-fr.png"
            alt="Plan des étages du Museo del Prado"
            draggable="false"
          >

          <!-- PARCOURS -->
          <svg
            class="traveloptim-route"
            id="traveloptim-route"
            viewBox="0 0 100 100"
            preserveAspectRatio="none"
            aria-hidden="true"
          >
            <polyline
              class="traveloptim-route-line"
              id="traveloptim-route-line"
              fill="none"
              points=""
            ></polyline>
          </svg>

          <div
            class="traveloptim-route-markers"
            id="traveloptim-route-markers"
            aria-hidden="true"
          ></div>

          <!-- OMBRES DES ÉTAGES -->
          <div class="floor-overlay" id="floor-overlay" aria-hidden="true">
            <div class="shade shade-top"></div>
            <div class="shade shade-right"></div>
            <div class="shade shade-bottom"></div>
            <div class="shade shade-left"></div>
          </div>

          <!-- PALETTES DES ŒUVRES -->
          <div class="artwork-markers" id="artwork-markers"></div>
        </div>

        <!-- CONTRÔLES DU PLAN -->
        <div class="map-controls" aria-label="Contrôles du plan" data-i18n-aria="controlsLabel">
          <div class="direction-controls">
            <button id="move-up" class="map-control-button direction-up" type="button" aria-label="Déplacer vers le haut" data-i18n-aria="moveUp">↑</button>
            <button id="move-left" class="map-control-button direction-left" type="button" aria-label="Déplacer vers la gauche" data-i18n-aria="moveLeft">←</button>
            <button id="move-right" class="map-control-button direction-right" type="button" aria-label="Déplacer vers la droite" data-i18n-aria="moveRight">→</button>
            <button id="move-down" class="map-control-button direction-down" type="button" aria-label="Déplacer vers le bas" data-i18n-aria="moveDown">↓</button>
          </div>

          <button id="zoom-in" class="map-control-button" type="button" aria-label="Agrandir le plan" data-i18n-aria="zoomIn">+</button>
          <button id="zoom-out" class="map-control-button" type="button" aria-label="Réduire le plan" data-i18n-aria="zoomOut">−</button>
          <button id="reset-map" class="map-control-button reset-map-button" type="button" aria-label="Recentrer le plan" data-i18n-aria="reset">⟳</button>
        </div>
      </div>
    </div>

    <!-- FICHE DÉTAILLÉE DE L’ŒUVRE -->
    <aside
      class="artwork-panel"
      id="artwork-panel"
      aria-hidden="true"
      aria-live="polite"
    >
      <button
        id="close-artwork-panel"
        class="panel-close-button"
        type="button"
        aria-label="Fermer la fiche" data-i18n-aria="close"
      >×</button>

      <div class="artwork-panel-content">

        <img
          id="panel-artwork-image"
          class="panel-artwork-image"
          alt=""
          hidden
        >

        <h2
          id="panel-artwork-title"
          class="panel-artwork-title"
        ></h2>

        <p
          id="panel-artwork-artist"
          class="panel-artwork-artist"
        ></p>

        <dl class="panel-artwork-details">

          <div class="artwork-detail">
            <dt data-i18n="year">Année</dt>
            <dd id="panel-artwork-year"></dd>
          </div>

          <div class="artwork-detail">
            <dt data-i18n="location">Localisation</dt>
            <dd>
              <span id="panel-artwork-floor"></span>
              <span aria-hidden="true"> · </span>
              <span id="panel-artwork-room"></span>
            </dd>
          </div>

          <div class="artwork-detail">
            <dt data-i18n="medium">Technique et dimensions</dt>
            <dd id="panel-artwork-medium"></dd>
          </div>

        </dl>

        <a
          id="panel-article-link"
          class="panel-article-link"
          href="#"
          data-i18n="articleLink"
          hidden
        >
          Explorer dans l’article
        </a>

      </div>
    </aside>

  </section>
</main>

<!-- FICHIERS JAVASCRIPT -->
<script src="data.js"></script>
<script src="translations.js"></script>
<script src="app.js"></script>

</body>
</html>
